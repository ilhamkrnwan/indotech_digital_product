<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perbandingan Desain: Goresan Kuas &amp; Cipratan Cat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar */
        .portal-bar {
            background: #1e293b;
            border-bottom: 2px solid #f7d801;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            z-index: 100;
        }

        .portal-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .portal-title {
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.01em;
        }
        .portal-subtitle {
            font-size: 12px;
            color: #94a3b8;
        }

        /* Switcher Buttons */
        .switch-group {
            display: flex;
            background: #0f172a;
            padding: 4px;
            border-radius: 8px;
            border: 1px solid #334155;
            gap: 4px;
        }
        .switch-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .switch-btn:hover {
            color: #ffffff;
        }
        .switch-btn.active {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.4);
        }
        .switch-btn.active.b-btn {
            background: #f7d801;
            color: #0f172a;
            box-shadow: 0 2px 6px rgba(247, 216, 1, 0.4);
        }

        .action-links {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .open-tab-btn {
            background: #334155;
            color: #f8fafc;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.15s;
        }
        .open-tab-btn:hover {
            background: #475569;
        }

        /* Frame Area */
        .iframe-container {
            flex: 1;
            position: relative;
            background: #f8fafc;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="portal-bar">
        <div class="portal-brand">
            <!-- Paint droplet dot -->
            <div style="width: 14px; height: 14px; background: #f7d801; border-radius: 50%; box-shadow: 0 0 8px #f7d801;"></div>
            <div>
                <div class="portal-title">Review Prototipe: Goresan Kuas &amp; Cipratan Cat</div>
                <div class="portal-subtitle">Diambil langsung dari tekstur referensi asli + aksen kawat geometris</div>
            </div>
        </div>

        <div class="switch-group">
            <button class="switch-btn active" id="btnA" onclick="loadOption('opsi-a-balanced.html', this, false)">
                <span>&#9670;</span> Opsi A: Balanced Studio
            </button>
            <button class="switch-btn" id="btnB" onclick="loadOption('opsi-b-expressive.html', this, true)">
                <span>&#9733;</span> Opsi B: Bold Expressive
            </button>
        </div>

        <div class="action-links">
            <a id="externalLink" href="opsi-a-balanced.html" target="_blank" class="open-tab-btn">
                Buka Tab Penuh &UpperRightArrow;
            </a>
        </div>
    </div>

    <div class="iframe-container">
        <iframe id="previewFrame" src="opsi-a-balanced.html"></iframe>
    </div>

    <script>
        function loadOption(url, btn, isB) {
            document.getElementById('previewFrame').src = url;
            document.getElementById('externalLink').href = url;
            
            document.querySelectorAll('.switch-btn').forEach(b => {
                b.classList.remove('active', 'b-btn');
            });
            
            btn.classList.add('active');
            if (isB) {
                btn.classList.add('b-btn');
            }
        }
    </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a21caf"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="popShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="8" dy="10" stdDeviation="0" flood-color="#1e293b" flood-opacity="0.95"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  <rect width="1200" height="800" fill="url(#gridPattern)"/>

  <!-- Decorative Sunburst Circles in corner -->
  <circle cx="1150" cy="50" r="180" fill="#d946ef" opacity="0.18"/>
  <circle cx="50" cy="750" r="140" fill="#fde047" opacity="0.25"/>

  <!-- Main Window Frame (Tactile Neo-Brutalist Playful Window) -->
  <g filter="url(#popShadow)" transform="translate(70, 60)">
    <!-- Window Outer Shell -->
    <rect width="1060" height="670" rx="24" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>

    <!-- Window Top Header Bar -->
    <path d="M 0 24 Q 0 0 24 0 L 1036 0 Q 1060 0 1060 24 L 1060 64 L 0 64 Z" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
    
    <!-- Window Controls (Red, Yellow, Green Playful Buttons) -->
    <circle cx="36" cy="32" r="9" fill="#ef4444" stroke="#1e293b" stroke-width="2"/>
    <circle cx="64" cy="32" r="9" fill="#f59e0b" stroke="#1e293b" stroke-width="2"/>
    <circle cx="92" cy="32" r="9" fill="#10b981" stroke="#1e293b" stroke-width="2"/>

    <!-- URL / Window Address Pill -->
    <rect x="240" y="16" width="580" height="32" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="530" y="37" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">
      indotechnology.co.id/store/saas-dashboard-ui-kit-figma-pro
    </text>

    <!-- Top Window Badge -->
    <g transform="translate(860, 16)">
      <rect width="170" height="32" rx="16" fill="#fef08a" stroke="#1e293b" stroke-width="2"/>
      <text x="85" y="21" font-family="'Fredoka', 'Outfit', sans-serif" font-size="11" font-weight="800" fill="#1e293b" text-anchor="middle">
        FIGMA .FIG INCLUDED
      </text>
    </g>

    <!-- Window Content Interior -->
    <g transform="translate(36, 90)">
      
      <!-- Top Meta Banner -->
      <g transform="translate(0, 0)">
        <rect width="220" height="28" rx="8" fill="#a21caf"/>
        <text x="110" y="19" font-family="'Fredoka', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
          COLOR TOKENS &amp; TYPOGRAPHY
        </text>

        <text x="0" y="70" font-family="'Fredoka', 'Outfit', sans-serif" font-size="34" font-weight="800" fill="#0f172a">
          Scalable UI Variables &amp; Assets
        </text>
        <text x="0" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#475569">
          Typography scales, custom icons pack, form input states, &amp; badge variants
        </text>
      </g>

      <!-- Simulated Rich UI Content Body -->
      <g transform="translate(0, 140)">
        <!-- Left Sidebar / Navigation Panel -->
        <g>
          <rect width="240" height="390" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
          
          <rect x="20" y="24" width="120" height="14" rx="4" fill="#a21caf"/>
          <rect x="20" y="55" width="200" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
          <text x="36" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#a21caf">📊 Overview &amp; Stats</text>
          
          <rect x="20" y="100" width="200" height="32" rx="6" fill="transparent"/>
          <text x="36" y="121" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#64748b">📦 Products &amp; Assets</text>
          
          <rect x="20" y="140" width="200" height="32" rx="6" fill="transparent"/>
          <text x="36" y="161" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#64748b">👥 Customer Orders</text>

          <rect x="20" y="180" width="200" height="32" rx="6" fill="transparent"/>
          <text x="36" y="201" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#64748b">⚙️ Configuration</text>

          <g transform="translate(20, 260)">
            <rect width="200" height="105" rx="12" fill="#fae8ff" stroke="#d946ef" stroke-width="2"/>
            <text x="16" y="32" font-family="'Fredoka', sans-serif" font-size="14" font-weight="800" fill="#a21caf">⚡ Ready to Deploy</text>
            <text x="16" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#334155">Full license included.</text>
            <rect x="16" y="70" width="168" height="24" rx="12" fill="#a21caf"/>
            <text x="100" y="86" font-family="'Fredoka', sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">ACTIVE VERSION 2026</text>
          </g>
        </g>

        <!-- Right Main Canvas Area -->
        <g transform="translate(265, 0)">
          
          <!-- Stat Cards Row -->
          <g>
            <!-- Card 1 -->
            <g transform="translate(0, 0)">
              <rect width="230" height="96" rx="14" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
              <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#64748b">TOTAL REVENUE</text>
              <text x="20" y="66" font-family="'Fredoka', sans-serif" font-size="26" font-weight="800" fill="#0f172a">Rp 48.950.000</text>
              <rect x="155" y="16" width="56" height="22" rx="11" fill="#dcfce7"/>
              <text x="183" y="31" font-family="'Fredoka', sans-serif" font-size="10" font-weight="800" fill="#15803d" text-anchor="middle">+28.4%</text>
            </g>

            <!-- Card 2 -->
            <g transform="translate(245, 0)">
              <rect width="230" height="96" rx="14" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
              <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#64748b">ACTIVE USERS</text>
              <text x="20" y="66" font-family="'Fredoka', sans-serif" font-size="26" font-weight="800" fill="#0f172a">1,480 UMKM</text>
              <rect x="155" y="16" width="56" height="22" rx="11" fill="#e0f2fe"/>
              <text x="183" y="31" font-family="'Fredoka', sans-serif" font-size="10" font-weight="800" fill="#0284c7" text-anchor="middle">VERIFIED</text>
            </g>

            <!-- Card 3 -->
            <g transform="translate(490, 0)">
              <rect width="230" height="96" rx="14" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
              <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#64748b">CONVERSION</text>
              <text x="20" y="66" font-family="'Fredoka', sans-serif" font-size="26" font-weight="800" fill="#0f172a">99.2% RATE</text>
              <rect x="155" y="16" width="56" height="22" rx="11" fill="#fef08a"/>
              <text x="183" y="31" font-family="'Fredoka', sans-serif" font-size="10" font-weight="800" fill="#ca8a04" text-anchor="middle">INSTANT</text>
            </g>
          </g>

          <!-- Middle Chart / Visual Data Widget -->
          <g transform="translate(0, 116)">
            <rect width="720" height="175" rx="16" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
            
            <text x="24" y="36" font-family="'Fredoka', sans-serif" font-size="17" font-weight="800" fill="#0f172a">Pertumbuhan Penjualan &amp; Aktivitas Sistem</text>
            <text x="24" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#64748b">Data terintegrasi otomatis dengan Payment Gateway</text>

            <!-- Chart Bars -->
            <g transform="translate(24, 75)">
              <rect x="0" y="45" width="45" height="45" rx="6" fill="#e2e8f0"/>
              <rect x="65" y="30" width="45" height="60" rx="6" fill="#e2e8f0"/>
              <rect x="130" y="15" width="45" height="75" rx="6" fill="#d946ef"/>
              <rect x="195" y="35" width="45" height="55" rx="6" fill="#e2e8f0"/>
              <rect x="260" y="20" width="45" height="70" rx="6" fill="#d946ef"/>
              <rect x="325" y="10" width="45" height="80" rx="6" fill="#a21caf"/>
              <rect x="390" y="25" width="45" height="65" rx="6" fill="#d946ef"/>
              <rect x="455" y="5" width="45" height="85" rx="6" fill="#a21caf"/>
              <rect x="520" y="18" width="45" height="72" rx="6" fill="#d946ef"/>
              <rect x="585" y="0" width="45" height="90" rx="6" fill="#fde047" stroke="#1e293b" stroke-width="2"/>
              <text x="607" y="-8" font-family="'Fredoka', sans-serif" font-size="11" font-weight="800" fill="#1e293b" text-anchor="middle">PEAK</text>
            </g>
          </g>

          <!-- Bottom Feature Bar -->
          <g transform="translate(0, 310)">
            <rect width="720" height="78" rx="14" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
            <circle cx="40" cy="39" r="18" fill="#d946ef"/>
            <text x="40" y="45" font-family="'Fredoka', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text>
            <text x="75" y="34" font-family="'Fredoka', sans-serif" font-size="15" font-weight="800" fill="#0f172a">Akses Penuh Selamanya &amp; Free Updates</text>
            <text x="75" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#64748b">Kode bersih, modular, dokumentasi instalasi lengkap, siap import.</text>
          </g>

        </g>
      </g>
    </g>
  </g>

  <!-- Washi Tape Over Top Frame to Match Neo-Brutalist Theme -->
  <g transform="translate(560, 48) rotate(-1.5)">
    <rect width="110" height="28" rx="3" fill="#fef08a" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 2" opacity="0.95"/>
  </g>
</svg>